# Pipeline del canal "Oraciones Biblicas Diarias".
#
# Se lanza a mano desde la pestana Actions con el boton "Run workflow".
# No corre solo: no hay push, ni pull_request, ni schedule.
#
# Checkpoint 1 — mide y prepara. No genera video, ni miniaturas, ni Shorts,
# y no publica nada.
name: Estudio — Checkpoint 1

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Que ejecutar'
        type: choice
        options:
          - sonda
          - importar
          - muestra
          - render
          - remux
          - diagnostico
          - shorts
          - shorts-render
        default: muestra
      proyecto:
        description: 'Para importar, muestra, render y remux: carpeta bajo estudio/proyectos/ (ej. video_001)'
        type: string
        default: ''
      run_origen:
        description: 'Para remux y diagnostico: numero del run cuyo artifact final-<proyecto> trae el video'
        type: string
        default: ''
      extra:
        description: 'Para muestra: segundo clip (piano = ventana con mas eventos de piano; recorrido = el zoom completo comprimido)'
        type: choice
        options:
          - piano
          - recorrido
          - ninguno
        default: piano
      confirmar:
        description: 'Escribe SI para confirmar'
        type: string
        required: true

permissions:
  contents: read
  # remux baja el artifact de un run anterior; leer artifacts pide este permiso.
  actions: read

concurrency:
  group: estudio-checkpoint1
  cancel-in-progress: false

jobs:
  checkpoint1:
    name: Checkpoint 1
    runs-on: ubuntu-latest
    timeout-minutes: 240

    # Casi todos los pasos son "node cli.mjs ... | tee -a $GITHUB_STEP_SUMMARY".
    # El shell por defecto de Actions es 'bash -e', sin pipefail: en una tuberia
    # solo cuenta el codigo de salida del ULTIMO mandato, que es siempre tee y
    # siempre vale 0. Sin esto, 'importar' podia fallar las 8 comprobaciones y
    # el job seguir en verde.
    defaults:
      run:
        shell: bash -eo pipefail {0}

    steps:
      - name: Confirmar
        if: inputs.confirmar != 'SI'
        run: |
          echo "::error::Escribe SI en el campo de confirmacion."
          exit 1

      - name: Comprobar que hay proyecto
        if: (inputs.modo == 'importar' || inputs.modo == 'muestra' || inputs.modo == 'render' || inputs.modo == 'remux' || inputs.modo == 'diagnostico' || inputs.modo == 'shorts' || inputs.modo == 'shorts-render') && inputs.proyecto == ''
        run: |
          echo "::error::Ese modo necesita el nombre del proyecto."
          exit 1

      - name: Comprobar que hay run de origen
        if: (inputs.modo == 'remux' || inputs.modo == 'diagnostico') && inputs.run_origen == ''
        run: |
          echo "::error::El modo remux necesita el numero del run que produjo el video."
          exit 1

      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: estudio/package-lock.json

      - name: Instalar dependencias
        working-directory: estudio
        run: npm ci

      # Comprueba que los secretos llegaron, sin revelarlos: solo si existen y
      # cuantos caracteres tienen, nunca el valor ni un fragmento.
      - name: Comprobar que los secretos existen
        working-directory: estudio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          node -e '
            let falta = false;
            for (const clave of ["ELEVENLABS_API_KEY", "ELEVENLABS_VOICE_ID"]) {
              const v = process.env[clave];
              if (v) {
                console.log(clave.padEnd(20) + " presente (" + v.length + " caracteres)");
              } else {
                console.log("::error::" + clave + " no esta definido. Crealo en Settings > Secrets and variables > Actions.");
                falta = true;
              }
            }
            process.exit(falta ? 1 : 0);
          '

      # Reachability sin autenticar: no mandamos la clave. Cualquier respuesta
      # HTTP, incluido un 401, demuestra que DNS, TLS y rutado funcionan.
      - name: Comprobar acceso a api.elevenlabs.io
        run: |
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            https://api.elevenlabs.io/v1/models || echo 000)
          echo "HTTP $codigo desde api.elevenlabs.io"
          if [ "$codigo" = "000" ]; then
            echo "::error::No hay salida de red hacia api.elevenlabs.io."
            exit 1
          fi
          echo "Host alcanzable."

      # ---------------------------------------------------------------- sonda

      - name: Ejecutar la sonda
        if: inputs.modo == 'sonda'
        working-directory: estudio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: node cli.mjs sonda

      - name: Preparar el resumen publicable
        if: always() && inputs.confirmar == 'SI' && inputs.modo == 'sonda'
        working-directory: estudio
        run: |
          if [ ! -f calibracion.json ]; then
            echo "No hay calibracion.json: la sonda no llego a completarse."
            exit 0
          fi
          mkdir -p ../resultado
          node cli.mjs resumen --json ../resultado/resumen-sonda.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar el resumen como artifact
        if: always() && inputs.confirmar == 'SI' && inputs.modo == 'sonda'
        uses: actions/upload-artifact@v4
        with:
          name: resumen-sonda
          path: resultado/resumen-sonda.json
          if-no-files-found: ignore
          retention-days: 30

      # ------------------------------------------------------------- importar

      - name: Comprobar los archivos subidos
        if: inputs.modo == 'importar' || inputs.modo == 'muestra' || inputs.modo == 'render' || inputs.modo == 'remux' || inputs.modo == 'shorts' || inputs.modo == 'shorts-render'
        working-directory: estudio/proyectos/${{ inputs.proyecto }}
        run: |
          echo "## Archivos del proyecto \`${{ inputs.proyecto }}\`" >> "$GITHUB_STEP_SUMMARY"
          faltan=0
          if [ ! -f narration.txt ]; then
            echo "::error::Falta narration.txt"; faltan=1
          else
            echo "- narration.txt — $(wc -c < narration.txt) bytes, $(grep -c '^[[:space:]]*$' narration.txt) lineas en blanco" >> "$GITHUB_STEP_SUMMARY"
          fi
          n=$(ls audio_fuente/*.mp3 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::No hay mp3 en audio_fuente/"; faltan=1
          else
            echo "- audio_fuente/ — $n archivos" >> "$GITHUB_STEP_SUMMARY"
            ls -1 audio_fuente/*.mp3 | sed 's|^|  - |' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $faltan

      # Deduce los limites de bloque de las duraciones del audio. No pisa un
      # edit_plan.json escrito a mano: ese seria la verdad editorial.
      - name: Generar el plan de edicion
        if: inputs.modo == 'importar' || inputs.modo == 'muestra' || inputs.modo == 'render' || inputs.modo == 'remux' || inputs.modo == 'shorts' || inputs.modo == 'shorts-render'
        working-directory: estudio
        run: |
          node cli.mjs plan-auto "${{ inputs.proyecto }}" --comparar | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Importar y validar
        if: inputs.modo == 'importar' || inputs.modo == 'muestra' || inputs.modo == 'render' || inputs.modo == 'remux' || inputs.modo == 'shorts' || inputs.modo == 'shorts-render'
        working-directory: estudio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          node cli.mjs importar "${{ inputs.proyecto }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # MP4 minimo para revisar la sincronia a ojo, sin montar un reproductor con
      # pistas externas. No es el renderer: negro, voz y subtitulos quemados.
      #
      # En remux no se genera: la sincronia ya esta aprobada sobre este mismo
      # audio, y el propio remux la comprueba midiendo el desfase de la voz.
      - name: Generar el video de revision
        if: inputs.modo == 'importar' || inputs.modo == 'muestra' || inputs.modo == 'render'
        working-directory: estudio
        run: |
          node cli.mjs previsualizar "${{ inputs.proyecto }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- muestra

      # Ventana corta con todo lo que llevara el video final: imagen con
      # movimiento, particulas, voz y cama musical con su ducking.
      - name: Renderizar la muestra
        if: inputs.modo == 'muestra'
        working-directory: estudio
        run: |
          node cli.mjs muestra "${{ inputs.proyecto }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # El piano suelta un grupo de notas cada medio minuto largo, asi que la
      # ventana de arriba —elegida por el interludio— puede no traer ninguna.
      # Este clip busca el tramo del video con mas eventos de piano: el peor
      # caso, que es lo que hay que escuchar para aprobarlos.
      - name: Renderizar la ventana con mas piano
        if: inputs.modo == 'muestra' && inputs.extra == 'piano'
        working-directory: estudio
        run: |
          node cli.mjs muestra "${{ inputs.proyecto }}" --duracion 90 --piano | tee -a "$GITHUB_STEP_SUMMARY"

      # A velocidad real el encuadre viaja unos 3 px en 80 segundos, asi que la
      # muestra no permite juzgar si el recorrido total es el adecuado. Este
      # segundo clip comprime todo el viaje de los 32:41 para poder verlo.
      - name: Renderizar el recorrido del zoom
        if: inputs.modo == 'muestra' && inputs.extra == 'recorrido'
        working-directory: estudio
        run: |
          node cli.mjs muestra "${{ inputs.proyecto }}" --duracion 30 --recorrido | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar la muestra como artifact
        if: always() && inputs.confirmar == 'SI' && inputs.modo == 'muestra'
        uses: actions/upload-artifact@v4
        with:
          name: muestra-${{ inputs.proyecto }}
          path: |
            estudio/proyectos/${{ inputs.proyecto }}/output/muestra.mp4
            estudio/proyectos/${{ inputs.proyecto }}/output/muestra-piano.mp4
            estudio/proyectos/${{ inputs.proyecto }}/output/muestra-recorrido.mp4
          if-no-files-found: warn
          retention-days: 30

      # ----------------------------------------------------------------- render

      # Los 32:41 completos. El cuello es zoompan sobre la imagen
      # sobremuestreada, no la codificacion: medido, cambiar el preset de x264
      # no mueve el tiempo. Ronda hora y media.
      - name: Renderizar el video completo
        if: inputs.modo == 'render'
        working-directory: estudio
        run: |
          node cli.mjs render "${{ inputs.proyecto }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------ remux
      #
      # Cambiar solo la mezcla de audio de un render ya aprobado. Los 32:41
      # cuestan hora y media de CPU, casi toda en zoompan; si la imagen no
      # cambia, repetir ese trabajo no aporta nada y ademas produciria
      # fotogramas nuevos sobre los que ya estaban aprobados.

      - name: Traer el video ya renderizado
        if: inputs.modo == 'remux' || inputs.modo == 'diagnostico'
        uses: actions/download-artifact@v4
        with:
          name: final-${{ inputs.proyecto }}
          path: origen
          run-id: ${{ inputs.run_origen }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remuxar solo el audio
        if: inputs.modo == 'remux'
        working-directory: estudio
        run: |
          node cli.mjs remuxar "${{ inputs.proyecto }}" \
            --video "$GITHUB_WORKSPACE/origen/video_final.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- shorts

      # Solo propone: que parrafos, que tiempos y donde caen los cortes. La
      # decision de que trozo del video se convierte en Short es editorial y hay
      # que poder leerla antes de renderizar nada.
      - name: Montar los Shorts
        if: inputs.modo == 'shorts-render'
        working-directory: estudio
        run: |
          node cli.mjs shorts "${{ inputs.proyecto }}" --render | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar los Shorts como artifact
        if: always() && inputs.confirmar == 'SI' && inputs.modo == 'shorts-render'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ inputs.proyecto }}
          path: estudio/proyectos/${{ inputs.proyecto }}/output/shorts/*.mp4
          if-no-files-found: warn
          retention-days: 30

      - name: Proponer los Shorts
        if: inputs.modo == 'shorts'
        working-directory: estudio
        run: |
          node cli.mjs shorts "${{ inputs.proyecto }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------ diagnostico
      #
      # Un MP4 puede decodificar entero y aun asi dejar al reproductor girando
      # en 0:00: las causas viven en el contenedor, no en los flujos. Esto mira
      # donde esta el indice, que dicen las listas de edicion, si el primer
      # fotograma es llave y si los tiempos arrancan en cero; con --reparar
      # reescribe el contenedor copiando el H.264 tal cual.
      - name: Diagnosticar el contenedor
        if: inputs.modo == 'diagnostico'
        working-directory: estudio
        run: |
          node cli.mjs diagnosticar "$GITHUB_WORKSPACE/origen/video_final.mp4" \
            --reparar --completo \
            --salida "$GITHUB_WORKSPACE/origen/video_final_web.mp4" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar el video corregido como artifact
        if: always() && inputs.confirmar == 'SI' && inputs.modo == 'diagnostico'
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ inputs.proyecto }}
          path: origen/video_final_web.mp4
          if-no-files-found: warn
          retention-days: 30

      - name: Guardar el video final como artifact
        if: always() && inputs.confirmar == 'SI' && (inputs.modo == 'render' || inputs.modo == 'remux')
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ inputs.proyecto }}
          path: |
            estudio/proyectos/${{ inputs.proyecto }}/output/video_final.mp4
            estudio/proyectos/${{ inputs.proyecto }}/output/subtitles.srt
          if-no-files-found: warn
          retention-days: 30

      # Se suben tambien si la importacion fallo: el informe de validacion es
      # justo lo que hace falta para saber por que.
      - name: Guardar el resultado como artifact
        if: always() && inputs.confirmar == 'SI' && (inputs.modo == 'importar' || inputs.modo == 'muestra' || inputs.modo == 'render' || inputs.modo == 'remux')
        uses: actions/upload-artifact@v4
        with:
          name: importacion-${{ inputs.proyecto }}
          path: |
            estudio/proyectos/${{ inputs.proyecto }}/output/revision.mp4
            estudio/proyectos/${{ inputs.proyecto }}/output/audio.mp3
            estudio/proyectos/${{ inputs.proyecto }}/output/subtitles.srt
            estudio/proyectos/${{ inputs.proyecto }}/output/timeline.json
            estudio/proyectos/${{ inputs.proyecto }}/output/validacion.json
            estudio/proyectos/${{ inputs.proyecto }}/output/alignment.json
            estudio/proyectos/${{ inputs.proyecto }}/edit_plan.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fin
        if: inputs.modo == 'importar' || inputs.modo == 'muestra' || inputs.modo == 'render' || inputs.modo == 'remux' || inputs.modo == 'shorts' || inputs.modo == 'shorts-render'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Terminado. No se ha publicado, ni hecho Shorts, ni miniatura." >> "$GITHUB_STEP_SUMMARY"
